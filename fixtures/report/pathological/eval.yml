# The render eval's PATHOLOGICAL fixture (design 2026-07-26-report-story-fidelity.md, Phase 13).
# Synthesized by `cargo run -p report --bin fixtures`; nothing here is derived from real session
# data, because tatari-tv/clyde is a public repo and session titles are the sensitive payload.
#
# This fixture exists to make the ABSENT-section paths bite: zero outcomes, one unpriced
# nonzero-token model (so the understatement warning is real rather than the false alarm Phase 6
# removed), a multi-day run of inactive by-day rows, sessions carried in from before the window,
# an attribution that is entirely path-guess, and zero enrich coverage.

summary: zero outcomes, an unpriced nonzero-token model, a multi-day gap, carried-in sessions, an all-guess attribution

require-sections:
  - Executive Summary
  - Cost Summary
  - Reconciliation
  - Agent-Type Cost Attribution
  - The Efficiency Story
  - What This Funded
  - Usage Profile
  - Conclusion

# Nothing was observed, so nothing may be claimed: `outcomes.totals` is present but every field is
# absent (present-if-nonzero), which the prompt reads as "omit Quantified Output". A render that
# emits it anyway invented output that never happened.
forbid-sections:
  - Quantified Output
  - Month over Month
  - Tradeoffs

floors:
  # Calibrated against observed judge scores, not aspiration. `citation-accuracy: 3` demands a
  # verdict of "nothing overreaches, nothing mis-attributed" from a stochastic writer AND a
  # stochastic grader; measured across the runs that produced these goldens, a clean artifact scored
  # 2 about as often as 3, with the judge's own reason text finding no concrete fault. A floor that
  # is red on a correct render gates nothing. 2 still fails "several unsupported claims" (1) and any
  # fabrication (0), and the mechanical layer independently proves no fabricated figure, repo, date
  # or quoted title can reach a golden at all.
  #
  # `coverage: 2` is the design's own criterion in floor form: a render that misses one of the top
  # three by-repo rows entirely scores 1 and exits non-zero.
  # `prohibition-compliance: 3` stays absolute -- every run cleared it, and it is the hard rule.
  citation-accuracy: 2
  coverage: 2
  prohibition-compliance: 3
  readability: 2

