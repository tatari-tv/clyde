[package]
name = "common"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Shared clyde umbrella surface: common CLI globals passed from clyde to each tool"

[lib]
name = "common"
path = "src/lib.rs"

[lints]
workspace = true

[features]
# The shared checkout matrix (`common::checkout`), a real-`git` fixture the routing/attribution
# phases assert against. OFF by default so the builders never reach a release binary; enabled as a
# DEV-dependency by the crates whose tests consume it. `tempfile` is already a normal dependency, so
# the feature adds no new dep, only the module.
testkit = []

[dependencies]
chrono.workspace = true
claude-pricing = { version = "2.0.0", path = "../pricing" }
dirs.workspace = true
eyre.workspace = true
log.workspace = true
regex = "1.12.4"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
tempfile.workspace = true
thiserror.workspace = true
wait-timeout = "0.2.1"
which.workspace = true
