otto:
  api: 1
  tasks: [ci]
  envs:
    VERSION: "$(git describe --tags --always --dirty 2>/dev/null || echo 'dev')"
    # 1500-line-per-file rule (rules/rust.md). Decompose, do not raise.
    BLOAT_MAX_LINES: "1500"

tasks:
  lint:
    help: "Run whitespace and convention linting"
    bash: |
      whitespace -r
      echo ""
      echo "=== Deny _variable binding pattern ==="
      # Scope is the whole tree with only `target` excluded, matching the em-dash lint below. The
      # narrow `*/src/` form this replaces never walked `*/tests/` or `*/build.rs`, and a lint
      # narrower than the rule is a hole the tree drifts back through where CI cannot see it.
      #
      # Status is checked EXPLICITLY, never via `if grep ...`. grep exits 0 on a match, 1 on no
      # match, 2+ on an error, and 127 when the binary is missing; a bare `if` reads every non-zero
      # exit as "clean". That is the exact fail-open that made the em-dash lint below a no-op in CI
      # from the day it landed, caught on PR #78 by the status check this one copies.
      #
      # Drop-guard carve-out, deliberately absent: `rules/rust.md` permits `let _guard = ...` for an
      # RAII guard whose whole purpose is `Drop`, and this pattern rejects that form. Zero such
      # bindings exist in the tree today. If one is ever added, WIDEN THIS LINT to admit it. Do not
      # rename the binding to satisfy a lint that is narrower than the rule it enforces.
      var_status=0
      grep -rn --include='*.rs' --exclude-dir=target -P '(\blet\s+(mut\s+)?|[(,]\s*|\|\s*|\bfor\s+)_[a-zA-Z]' . || var_status=$?
      case "$var_status" in
        0)
          echo ""
          echo "❌ Found _variable binding pattern."
          echo "   Use _ to discard or use the variable, never _varname."
          exit 1
          ;;
        1)
          echo "✅ No _variable patterns found"
          ;;
        *)
          echo ""
          echo "❌ grep exited $var_status scanning for _variable patterns (not 0=found / 1=clean)."
          echo "   The scan did not complete, so this is a lint FAILURE, not a pass."
          exit 1
          ;;
      esac
      echo ""
      echo "=== Deny em dash in Rust source and slot templates ==="
      # `grep`, NOT `rg`: ripgrep is NOT installed on the CI runner, and the first version of this
      # lint used it. `rg: command not found` exits 127, which an `if rg ...; then` reads as
      # "no match", so the lint printed its success line having scanned NOTHING. It was a no-op in
      # CI from the day it landed, and a green run proved only that rg was absent. Found by the
      # explicit status check below on PR #78, which is exactly what that check is for.
      #
      # `\x{2014}` (PCRE codepoint escape, hence -P) rather than the literal character, so this file
      # stays em-dash-free itself. Verified to match under LC_ALL=C, POSIX, and C.UTF-8, so it does not
      # depend on the runner's locale. The raw-byte form `\xe2\x80\x94` was tried first and matches
      # NOTHING under -P, which is why the pattern is written this way.
      # Scope stays the whole tree with only `target` excluded: 17 of the 369 original occurrences
      # lived in `*/tests/`, which the sibling lint above used to miss and now covers too.
      #
      # `*.pmt` is scanned alongside `*.rs` because the 5 slot templates
      # (`report/templates/slots/*.pmt`) are compiled in via `include_str!` and sent verbatim to a
      # model, so an em dash in one reaches the same place an em dash in a Rust string literal would.
      # `--include='*.rs'` alone cannot see them. `report/src/render/slots/tests.rs` also asserts
      # `!prompt.contains('\u{2014}')` per slot: prompts that go to a model get both checks.
      #
      # Status is checked EXPLICITLY, never via `if grep ...`. grep exits 0 on a match, 1 on no
      # match, and 2+ on an error (and 127 if the binary is missing). A bare `if` treats every
      # non-zero as "clean", which is the fail-open this comment exists to document.
      em_status=0
      grep -rn --include='*.rs' --include='*.pmt' --exclude-dir=target -P '\x{2014}' . || em_status=$?
      case "$em_status" in
        0)
          echo ""
          echo "❌ Found em dash in Rust source or slot template."
          echo "   Use --, a colon, parens, or split the sentence (rules/voice.md)."
          echo "   To assert an em dash is ABSENT, write '\\u{2014}' rather than the literal."
          exit 1
          ;;
        1)
          echo "✅ No em dashes in Rust source or slot templates"
          ;;
        *)
          echo ""
          echo "❌ grep exited $em_status scanning for em dashes (not 0=found / 1=clean)."
          echo "   The scan did not complete, so this is a lint FAILURE, not a pass."
          exit 1
          ;;
      esac

  bloat:
    help: "Fail if any source file exceeds BLOAT_MAX_LINES (default 1500)"
    bash: |
      LIMIT="${BLOAT_MAX_LINES:-1500}"
      FAILED=0
      echo "=== Checking file line counts (limit: $LIMIT) ==="
      while IFS= read -r file; do
        lines=$(wc -l < "$file")
        if [ "$lines" -gt "$LIMIT" ]; then
          delta=$((lines - LIMIT))
          echo "  FAIL: $file ($lines lines, +$delta over limit)"
          FAILED=1
        fi
      done < <(find . -type f -name "*.rs" -not -path "*/target/*" -not -path "*/.git/*")
      if [ "$FAILED" -eq 1 ]; then
        echo ""
        echo "Decompose these files into modules before proceeding."
        exit 1
      fi
      echo "All files within $LIMIT line limit"

  check:
    help: "Run all quality checks (compile, clippy, format)"
    bash: |
      echo "=== Checking compilation ==="
      cargo check --workspace --all-targets --all-features
      echo ""
      # The non-fetch build of claude-pricing, which NO other job covers. Every check above uses
      # --all-features (which turns `fetch` ON) and --workspace (which unifies features across
      # members regardless), yet `efficiency` and `common` both depend on claude-pricing WITHOUT
      # fetch, as do the external `ccu`/`cr` pins. Without this line a feature-gated item that only
      # exists under `fetch` can be referenced from ungated code and every job stays green.
      # Lib-only on purpose: the crate's own test target needs `log/std`, which only the workspace
      # build unifies in, so --all-targets here would fail for a reason unrelated to this guard.
      echo "=== Checking claude-pricing without the fetch feature ==="
      cargo check -p claude-pricing
      echo ""
      echo "=== Running Clippy ==="
      cargo clippy --workspace --all-targets --all-features -- -D warnings
      echo ""
      echo "=== Checking format ==="
      cargo fmt --all --check
      echo ""
      echo "✅ All checks passed!"

  test:
    help: "Run all tests"
    bash: |
      # --no-fail-fast: cargo runs crates in order and stops at the first failing crate, so
      # without it one early-crate failure silently skips every later crate's tests and the
      # run reads as "one known failure" rather than "N suites never ran" (issue #66).
      cargo test --workspace --no-fail-fast

  ci:
    help: "Full CI pipeline (lint + bloat + check + test in parallel)"
    before: [lint, bloat, check, test]
    bash: |
      echo "✅ All CI checks passed!"

  mutants:
    help: "Mutation-test the routing path; ZERO unannotated survivors (NOT part of ci: see below)"
    bash: |
      # The gate register item 4 needed and did not have. A test that does not BITE is a surviving
      # mutant, and that is the one check which catches the whole defect class automatically, forever,
      # without anyone remembering to look. Design:
      # docs/design/2026-07-31-attribution-and-routing.md (Phase 5).
      #
      # THE THRESHOLD IS ZERO. Not "whatever was measured". A survivor budget of N lets a NEW survivor
      # hide behind a fixed old one while the count never moves; an annotated `// mutants:skip` with a
      # rationale is reviewable in a diff and a number is not. If a survivor is genuinely unavoidable,
      # annotate it at the smallest site with one line saying why. Do NOT raise a threshold, because
      # there is no threshold to raise.
      #
      # VERSION PINNED so a toolchain refresh cannot silently change the gate: a newer cargo-mutants
      # that generates different mutants would change what "zero" means without anyone deciding to.
      MUTANTS_VERSION="27.1.0"
      have=$(cargo mutants --version 2>/dev/null | awk '{print $2}')
      if [ "$have" != "$MUTANTS_VERSION" ]; then
        echo "installing cargo-mutants $MUTANTS_VERSION (found: ${have:-none})"
        cargo install cargo-mutants --version "$MUTANTS_VERSION" --locked
      fi

      # `--workspace` is REQUIRED and not decorative: this repo sets `default-members = ["clyde"]`,
      # so without it cargo-mutants scopes to `clyde` alone, finds none of the files below, and
      # reports success having tested NOTHING. Measured: the first run of this command listed 0
      # mutants and exited 0.
      #
      # Six paths, not two. Two was the earlier draft's scope and both reviewers called it too narrow:
      # the routing decision is spread across the classifier, the resolver, the sweep, the candidate
      # predicate, rule 3's input, and the migration that carries the columns.
      #
      # Default (per-package) test scope, NOT `--test-workspace`. Each mutant is checked by its
      # OWNING package's tests, which is the stricter discipline and not a weaker one: it forces the
      # biting test to live in the crate that owns the code. Proven necessary by the
      # `scope_override` comparison in `session/src/scope.rs`, which `sessions` already asserted end
      # to end and which survived anyway, because a mutant is only checked by the tests that run for
      # it. The fix was a unit test in `session`, not a wider flag.
      #
      # `--test-workspace true` was tried and dropped: it multiplies runtime roughly five-fold for no
      # additional finding once every crate owns its coverage.
      #
      # `TMPDIR` is redirected to a DISK-backed scratch dir, and `--jobs` is capped at 8. Both
      # are the same measured lesson: cargo-mutants gives every job its own copy of the workspace
      # AND its own `target/`, and on this host `/tmp` is a 16 GB tmpfs. A 12-job run filled it and
      # died with `No space left on device (os error 28)` partway through, having reported zero
      # survivors up to that point, which is a FALSE GREEN if anyone reads only the survivor count.
      # cargo-mutants' own startup warning says jobs above 8 is probably too high, so 8 is the
      # ceiling; the disk-backed scratch is what makes even that safe.
      #
      # `/var/tmp`, NOT somewhere under the repo and NOT under `$HOME`. The scratch dir becomes
      # `$TMPDIR` for the tests too, and `common::repo`'s tests create real directories there and
      # assert they are NOT inside a git repository. `has_git_marker` walks LEXICAL ancestors, and
      # both `$PWD/target/...` (this repo) and `$HOME/...` (Scott's dotfiles repo) have a `.git`
      # above them, so either choice makes a plain temp dir read as "a repository is present" and
      # the baseline fails before a single mutant runs. Measured, with the scratch inside `target/`:
      #   test repo::tests::detect_is_conclusively_not_a_repo_for_a_plain_directory ... FAILED
      #   ERROR cargo test failed in an unmutated tree, so no mutants were tested
      export TMPDIR="${TMPDIR_MUTANTS:-/var/tmp/clyde-mutants}"
      mkdir -p "$TMPDIR"

      # `-t 300` is an EXPLICIT test timeout, and the auto-set one is why. cargo-mutants derives it
      # from the unmutated baseline, measured on an idle machine; the mutants then run N-way parallel,
      # so the real per-mutant budget is a fraction of what the baseline saw. Observed: a chunk whose
      # baseline auto-set 20s reported 21 TIMEOUTs out of 22 results, including
      # `replace ProbeOutcome::as_str -> "xyzzy"`, which cannot hang. Those are load artifacts, not
      # findings, and a gate that manufactures them teaches everyone to ignore it. 300s is roughly
      # 15x the idle workspace suite, which absorbs the parallelism.
      #
      # `RAYON_NUM_THREADS` caps the INNER parallelism, and without it `--jobs` is not the job count.
      # `--jobs N` bounds how many mutants are tested at once; it says NOTHING about what each of
      # those test binaries then does. `efficiency` links rayon, and a rayon pool defaults to `nproc`,
      # so every concurrent mutant spawns its OWN pool sized to the whole machine. Measured on
      # desk.lan (32 cores, --jobs 8): 8 x 32 = 256 runnable threads, load average 167, and the
      # comment directly above becomes false -- 300s was chosen to absorb 8x parallelism, not 256x,
      # so the run drifts straight back into manufacturing the timeout artifacts it exists to avoid.
      #
      # Derived, not hardcoded: `cores / jobs` is the share each mutant is entitled to, so the two
      # numbers cannot drift apart and a machine with a different core count gets the right answer.
      # Floored at 1 for a host with fewer cores than jobs. Capping rayon does not change any
      # assertion -- `par_iter().map().collect()` is order-preserving regardless of pool size, and
      # none of the mutated files reasons about thread counts.
      MUTANT_JOBS=8
      CORES=$(nproc)
      export RAYON_NUM_THREADS=$(( CORES / MUTANT_JOBS > 0 ? CORES / MUTANT_JOBS : 1 ))
      echo "mutants: --jobs $MUTANT_JOBS x RAYON_NUM_THREADS=$RAYON_NUM_THREADS on $CORES cores"

      cargo mutants --workspace --timeout 300 \
        -f "session/src/scope.rs" \
        -f "common/src/repo.rs" \
        -f "sessions/src/enrich.rs" \
        -f "sessions/src/db/enrich.rs" \
        -f "efficiency/src/outcome.rs" \
        -f "sessions/src/db/migrate.rs" \
        --jobs "$MUTANT_JOBS"

  eval:
    help: "Judged render eval over the committed fixtures (PAID: LLM calls; NOT part of ci)"
    bash: |
      # Deliberately NOT a `before:` of ci. The judge costs tokens and needs a network, so it runs
      # before a release, not on every commit (design 2026-07-26-report-story-fidelity.md,
      # Non-Goals). The FREE, deterministic half of the same checks already runs in `ci`, offline,
      # against the committed golden artifacts.
      #
      # `--llm api` is pinned: the fixtures are small, the api transport is the one CI-shaped
      # callers can rely on, and `auto` would silently pick whichever transport this host happens
      # to have. For the keyless path run `clyde report eval --llm cli` directly.
      cargo run -q -p clyde -- report eval --llm api --out eval-report.json

  build:
    help: "Build release binary"
    bash: |
      cargo build --release
      echo "✅ Release build complete"
