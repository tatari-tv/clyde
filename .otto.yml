otto:
  api: 1
  tasks: [ci]
  envs:
    VERSION: "$(git describe --tags --always --dirty 2>/dev/null || echo 'dev')"
    # 1500-line-per-file rule (rules/rust.md). Decompose, do not raise.
    BLOAT_MAX_LINES: "1500"

tasks:
  lint:
    help: "Run whitespace and convention linting"
    bash: |
      whitespace -r
      echo ""
      echo "=== Deny _variable binding pattern ==="
      if grep -rn --include='*.rs' -P '(\blet\s+(mut\s+)?|[(,]\s*|\|\s*|\bfor\s+)_[a-zA-Z]' */src/; then
        echo ""
        echo "❌ Found _variable binding pattern."
        echo "   Use _ to discard or use the variable, never _varname."
        exit 1
      fi
      echo "✅ No _variable patterns found"
      echo ""
      echo "=== Deny em dash in Rust source ==="
      # `rg`, not `grep -r ... */src/`: 17 of the 373 occurrences this lint was written to kill lived
      # in */tests/ integration files, which a */src/ walk never reaches. A lint narrower than the rule
      # is a hole the tree drifts back through where CI cannot see it. Using rg also makes this command
      # and the design's acceptance criterion literally the same one, so they cannot diverge.
      # `\x{2014}` (not the character) keeps this file em-dash-free too.
      # Status is checked EXPLICITLY, not via `if rg ...`. ripgrep exits 0 on a match, 1 on no
      # match, and 2 on an error (bad glob, unreadable path, broken regex). A bare `if` treats 2
      # like 1, so a lint that silently stopped scanning would report success: fail-open, in the one
      # place that exists to fail closed.
      em_status=0
      rg -n --type rust -g '!target' '\x{2014}' . || em_status=$?
      case "$em_status" in
        0)
          echo ""
          echo "❌ Found em dash in Rust source."
          echo "   Use --, a colon, parens, or split the sentence (rules/voice.md)."
          echo "   To assert an em dash is ABSENT, write '\\u{2014}' rather than the literal."
          exit 1
          ;;
        1)
          echo "✅ No em dashes in Rust source"
          ;;
        *)
          echo ""
          echo "❌ ripgrep exited $em_status scanning for em dashes (not 0=found / 1=clean)."
          echo "   The scan did not complete, so this is a lint FAILURE, not a pass."
          exit 1
          ;;
      esac

  bloat:
    help: "Fail if any source file exceeds BLOAT_MAX_LINES (default 1500)"
    bash: |
      LIMIT="${BLOAT_MAX_LINES:-1500}"
      FAILED=0
      echo "=== Checking file line counts (limit: $LIMIT) ==="
      while IFS= read -r file; do
        lines=$(wc -l < "$file")
        if [ "$lines" -gt "$LIMIT" ]; then
          delta=$((lines - LIMIT))
          echo "  FAIL: $file ($lines lines, +$delta over limit)"
          FAILED=1
        fi
      done < <(find . -type f -name "*.rs" -not -path "*/target/*" -not -path "*/.git/*")
      if [ "$FAILED" -eq 1 ]; then
        echo ""
        echo "Decompose these files into modules before proceeding."
        exit 1
      fi
      echo "All files within $LIMIT line limit"

  check:
    help: "Run all quality checks (compile, clippy, format)"
    bash: |
      echo "=== Checking compilation ==="
      cargo check --workspace --all-targets --all-features
      echo ""
      # The non-fetch build of claude-pricing, which NO other job covers. Every check above uses
      # --all-features (which turns `fetch` ON) and --workspace (which unifies features across
      # members regardless), yet `efficiency` and `common` both depend on claude-pricing WITHOUT
      # fetch, as do the external `ccu`/`cr` pins. Without this line a feature-gated item that only
      # exists under `fetch` can be referenced from ungated code and every job stays green.
      # Lib-only on purpose: the crate's own test target needs `log/std`, which only the workspace
      # build unifies in, so --all-targets here would fail for a reason unrelated to this guard.
      echo "=== Checking claude-pricing without the fetch feature ==="
      cargo check -p claude-pricing
      echo ""
      echo "=== Running Clippy ==="
      cargo clippy --workspace --all-targets --all-features -- -D warnings
      echo ""
      echo "=== Checking format ==="
      cargo fmt --all --check
      echo ""
      echo "✅ All checks passed!"

  test:
    help: "Run all tests"
    bash: |
      # --no-fail-fast: cargo runs crates in order and stops at the first failing crate, so
      # without it one early-crate failure silently skips every later crate's tests and the
      # run reads as "one known failure" rather than "N suites never ran" (issue #66).
      cargo test --workspace --no-fail-fast

  ci:
    help: "Full CI pipeline (lint + bloat + check + test in parallel)"
    before: [lint, bloat, check, test]
    bash: |
      echo "✅ All CI checks passed!"

  eval:
    help: "Judged render eval over the committed fixtures (PAID: LLM calls; NOT part of ci)"
    bash: |
      # Deliberately NOT a `before:` of ci. The judge costs tokens and needs a network, so it runs
      # before a release, not on every commit (design 2026-07-26-report-story-fidelity.md,
      # Non-Goals). The FREE, deterministic half of the same checks already runs in `ci`, offline,
      # against the committed golden artifacts.
      #
      # `--llm api` is pinned: the fixtures are small, the api transport is the one CI-shaped
      # callers can rely on, and `auto` would silently pick whichever transport this host happens
      # to have. For the keyless path run `clyde report eval --llm cli` directly.
      cargo run -q -p clyde -- report eval --llm api --out eval-report.json

  build:
    help: "Build release binary"
    bash: |
      cargo build --release
      echo "✅ Release build complete"
