name: Pages

on:
  push:
    branches: [main]
    paths:
      - pricing/data/pricing.json
      # Without this, edits to the page never deploy and NOTHING reports
      # an error: the workflow simply does not run. That silent failure is
      # why it gets its own acceptance criterion in the design doc.
      - pricing/site/index.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Stage Pages content
        run: |
          mkdir -p _site
          cp pricing/data/pricing.json _site/pricing.json
          # The site root. The page reads ./pricing.json client-side, so
          # the two must be staged together as same-origin siblings.
          cp pricing/site/index.html _site/index.html
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
